<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 Rookie Pitchers — Tier 1 Radar</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #ffffff;
    color: #1a1916;
    padding: 20px 16px 16px;
  }
  .chart-title { font-size: 15px; font-weight: 600; color: #1a1916; margin-bottom: 4px; }
  .chart-sub { font-size: 11.5px; color: #6b6860; margin-bottom: 12px; line-height: 1.5; }
  .wrap { display: flex; flex-direction: column; align-items: center; }
  .canvas-wrap { position: relative; width: 100%; max-width: 460px; height: 380px; }
  canvas { display: block; width: 100% !important; }
  .legend { display: flex; gap: 20px; margin-top: 10px; font-size: 12px; flex-wrap: wrap; justify-content: center; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-line { width: 28px; height: 3px; border-radius: 2px; display: inline-block; }
  .legend-name { font-weight: 600; color: #1a1916; }
  .legend-team { color: #6b6860; }
  .footer { font-size: 11px; color: #6b6860; margin-top: 8px; text-align: center; padding-bottom: 0.5rem; }

  @media (max-width: 600px) {
    .canvas-wrap { height: 280px; }
    .chart-title { font-size: 13px; }
    .chart-sub { font-size: 10.5px; }
  }
</style>
</head>
<body>

<p class="chart-title">Tier 1 — Profile comparison</p>
<p class="chart-sub">Tolle · Henderson · Yesavage · Scaled relative to 2026 rookie class · Hover or tap each point for raw stat</p>

<div class="wrap">
  <div class="canvas-wrap">
    <canvas id="radar"></canvas>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="legend-line" style="background:#1d9e75;"></div><span class="legend-name">Tolle</span><span class="legend-team">BOS</span></div>
    <div class="legend-item"><div class="legend-line" style="background:#378add;"></div><span class="legend-name">Henderson</span><span class="legend-team">MIL</span></div>
    <div class="legend-item"><div class="legend-line" style="background:#d85a30;"></div><span class="legend-name">Yesavage</span><span class="legend-team">TOR</span></div>
  </div>
  <p class="footer">Z-scores relative to 2026 rookie class · Outer ring = best in class · Inner ring = class avg</p>
</div>

<script>
const labels = ['K-BB%','Stuff+','CSW%','Z-Contact%','HardHit%'];

function scaleZ(z) { return Math.min(Math.max((z + 2.5) / 5.0, 0), 1); }

const players = [
  {
    name: 'Payton Tolle',
    z:   [1.2222, 1.8949, 0.0235, 1.3012, 0.5165],
    raw: ['20.3%', '114.0', '26.9%', '82.3%', '34.4%'],
    color: '#1d9e75',
    fill: 'rgba(30,158,117,0.12)',
  },
  {
    name: 'Logan Henderson',
    z:   [2.1225, 0.9735, 0.3489, 2.6519, 1.5235],
    raw: ['26.7%', '107.2', '27.4%', '77.5%', '29.6%'],
    color: '#378add',
    fill: 'rgba(55,138,221,0.10)',
  },
  {
    name: 'Trey Yesavage',
    z:   [0.434, 1.4813, -0.0425, 0.9958, 1.8108],
    raw: ['14.8%', '110.9', '26.8%', '83.3%', '28.3%'],
    color: '#d85a30',
    fill: 'rgba(216,90,48,0.10)',
  },
];

const avgDataset = {
  label: 'Class avg',
  data: [0,0,0,0,0].map(scaleZ),
  raw: null,
  backgroundColor: 'transparent',
  borderColor: 'rgba(0,0,0,0.14)',
  borderWidth: 1,
  borderDash: [4,3],
  pointRadius: 0,
  pointHoverRadius: 0,
};

const datasets = players.map(p => ({
  label: p.name,
  data: p.z.map(scaleZ),
  raw: p.raw,
  backgroundColor: p.fill,
  borderColor: p.color,
  borderWidth: 2,
  pointBackgroundColor: p.color,
  pointBorderColor: 'transparent',
  pointRadius: 2,
  pointHoverRadius: 4,
}));
datasets.push(avgDataset);

new Chart(document.getElementById('radar'), {
  type: 'radar',
  data: { labels, datasets },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    animation: false,
    plugins: {
      legend: { display: false },
      tooltip: {
        callbacks: {
          title(items) { return items[0].dataset.label || ''; },
          label(ctx) {
            if (!ctx.dataset.raw) return '';
            return ` ${labels[ctx.dataIndex]}: ${ctx.dataset.raw[ctx.dataIndex]}`;
          }
        },
        backgroundColor: '#ffffff',
        borderColor: 'rgba(0,0,0,0.12)',
        borderWidth: 1,
        titleColor: '#1a1916',
        bodyColor: '#6b6860',
        padding: 9,
        displayColors: false,
      }
    },
    scales: {
      r: {
        min: 0, max: 1,
        ticks: { display: false },
        grid: { color: 'rgba(0,0,0,0.07)' },
        angleLines: { color: 'rgba(0,0,0,0.07)' },
        pointLabels: { color: '#3a3a36', font: { size: 12, weight: '500' } }
      }
    }
  }
});

// Touch support
const canvas = document.getElementById('radar');
const chartInstance = Chart.getChart(canvas);
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  const pts = chartInstance.getElementsAtEventForMode(e, 'nearest', {radius:20}, true);
  if (pts.length) chartInstance.tooltip.setActiveElements([pts[0]], {x:t.clientX, y:t.clientY});
  chartInstance.update();
}, {passive:false});
</script>
</body>
</html>
