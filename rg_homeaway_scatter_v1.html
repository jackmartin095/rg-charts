<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>RG HomeAway Scatter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#ffffff; --text-primary:#1a1916; --text-secondary:#6b6860;
    --grid:rgba(0,0,0,0.06); --ref:rgba(0,0,0,0.30); --reflabel:rgba(0,0,0,0.34);
    --dot:#9a958c; --dot-line:rgba(0,0,0,0.18);
    --home:#2f9e8f; --home-line:#1f6f64; --away:#d96a52; --away-line:#a84634;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#15140f; --text-primary:#e8e6df; --text-secondary:#a39a8c;
      --grid:rgba(255,255,255,0.08); --ref:rgba(255,255,255,0.34); --reflabel:rgba(255,255,255,0.4);
      --dot:#8a857c; --dot-line:rgba(255,255,255,0.2);
      --home:#54c4b2; --home-line:#8fdacf; --away:#e8917b; --away-line:#f0b3a3;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text-primary);padding:16px 14px 10px;}
  .chart-title{font-size:15px;font-weight:600;margin-bottom:3px;}
  .chart-sub{font-size:11.5px;color:var(--text-secondary);margin-bottom:10px;line-height:1.5;}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--text-secondary);}
  .legend-item{display:flex;align-items:center;gap:5px;}
  .legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  svg{display:block;width:100%;height:auto;}
  svg text{font-family:'Space Grotesk',-apple-system,sans-serif;}
  .axis{font-size:10px;fill:var(--text-secondary);}
  .axtitle{font-size:11px;font-weight:600;fill:var(--text-secondary);}
  .reflabel{font-size:10px;fill:var(--reflabel);}
  .plabel{font-size:10.5px;font-weight:600;}
  #tip{display:none;position:fixed;z-index:9999;pointer-events:none;min-width:170px;padding:9px 12px;
    background:var(--bg);color:var(--text-primary);border:1px solid var(--grid);border-radius:7px;
    box-shadow:0 4px 16px rgba(0,0,0,0.14);font-size:12px;}
  .tip-name{font-size:13px;font-weight:600;margin-bottom:4px;}
  .tip-team{font-weight:400;color:var(--text-secondary);}
  .tip-r{display:flex;justify-content:space-between;gap:16px;margin:2px 0;}
  .tip-r .lab{color:var(--text-secondary);}
</style>
</head>

const W=560, H=560, M={t:46,r:18,b:46,l:46};
const NS='http://www.w3.org/2000/svg';
function el(n,a){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;}
document.getElementById('t').textContent=CONFIG.title;
document.getElementById('s').textContent=CONFIG.subtitle;

const x=v=>M.l+(v-CONFIG.dom[0])/(CONFIG.dom[1]-CONFIG.dom[0])*(W-M.l-M.r);
const y=v=>M.t+(1-(v-CONFIG.dom[0])/(CONFIG.dom[1]-CONFIG.dom[0]))*(H-M.t-M.b);

const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,role:'img'});

// gridlines + ticks every 1.0 from 2..7
for(let v=2; v<=7; v++){
  svg.appendChild(el('line',{x1:x(v),y1:M.t,x2:x(v),y2:H-M.b,stroke:'var(--grid)','stroke-width':1}));
  svg.appendChild(el('line',{x1:M.l,y1:y(v),x2:W-M.r,y2:y(v),stroke:'var(--grid)','stroke-width':1}));
  let tx=el('text',{x:x(v),y:H-M.b+15,'text-anchor':'middle',class:'axis'});tx.textContent=v;svg.appendChild(tx);
  let ty=el('text',{x:M.l-7,y:y(v)+3,'text-anchor':'end',class:'axis'});ty.textContent=v;svg.appendChild(ty);
}
// diagonal (equal home/away)
const lo=CONFIG.dom[0], hi=CONFIG.dom[1];
svg.appendChild(el('line',{x1:x(lo),y1:y(lo),x2:x(hi),y2:y(hi),stroke:'var(--ref)','stroke-width':1,'stroke-dasharray':'5 4'}));

// quadrant hints
let qa=el('text',{x:M.l+4,y:M.t+14,'text-anchor':'start',class:'reflabel',fill:'var(--away-line)'});qa.textContent='↖ better away';svg.appendChild(qa);
let qh=el('text',{x:W-M.r-4,y:H-M.b-8,'text-anchor':'end',class:'reflabel',fill:'var(--home-line)'});qh.textContent='better at home ↘';svg.appendChild(qh);
// axis titles
let xt=el('text',{x:(M.l+W-M.r)/2,y:H-6,'text-anchor':'middle',class:'axtitle'});xt.textContent='Away FIP';svg.appendChild(xt);
let yt=el('text',{x:14,y:(M.t+H-M.b)/2,'text-anchor':'middle',class:'axtitle',transform:`rotate(-90 14 ${(M.t+H-M.b)/2})`});yt.textContent='Home FIP';svg.appendChild(yt);

// non-featured dots first
const tip=document.getElementById('tip');
function showTip(d,cx,cy){
  const home=d.gap>0;
  tip.innerHTML='<div class="tip-name">'+d.name+' <span class="tip-team">('+d.team+')</span></div>'+
    '<div class="tip-r"><span class="lab">Home FIP</span><span style="font-weight:700;">'+d.fipH.toFixed(2)+'</span></div>'+
    '<div class="tip-r"><span class="lab">Away FIP</span><span style="font-weight:700;">'+d.fipA.toFixed(2)+'</span></div>'+
    '<div class="tip-r"><span class="lab">split</span><span style="font-weight:700;color:'+(home?'var(--home-line)':'var(--away-line)')+';">'+(d.gap>=0?'+':'')+d.gap.toFixed(2)+' '+(home?'home':'away')+'</span></div>';
  let lx=cx+14,ty=cy-10;const tw=185,th=110;
  if(lx+tw>window.innerWidth-10)lx=cx-tw-14;
  if(ty+th>window.innerHeight-10)ty=window.innerHeight-th-10;if(ty<8)ty=8;
  tip.style.left=lx+'px';tip.style.top=ty+'px';tip.style.display='block';
}
function attach(node,d){
  node.style.cursor='pointer';
  node.addEventListener('mousemove',e=>showTip(d,e.clientX,e.clientY));
  node.addEventListener('mouseleave',()=>tip.style.display='none');
  node.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];showTip(d,t.clientX,t.clientY);},{passive:false});
}
DATA.filter(d=>!d.feat).forEach(d=>{
  const c=el('circle',{cx:x(d.fipA),cy:y(d.fipH),r:3.4,fill:'var(--dot)','fill-opacity':0.5,stroke:'var(--dot-line)','stroke-width':0.6});
  // larger invisible hit target for easier hover
  const hit=el('circle',{cx:x(d.fipA),cy:y(d.fipH),r:8,fill:'transparent'});
  attach(hit,d); svg.appendChild(c); svg.appendChild(hit);
});
// featured dots on top, colored by side + labeled
DATA.filter(d=>d.feat).forEach(d=>{
  const home=d.gap>0;
  const fc=el('circle',{cx:x(d.fipA),cy:y(d.fipH),r:5.5,
    fill:home?'var(--home)':'var(--away)',stroke:home?'var(--home-line)':'var(--away-line)','stroke-width':1.2});
  attach(fc,d); svg.appendChild(fc);
  const last=d.name.split(' ').slice(-1)[0];
  const off=(d.name==='Bryan Woo')?{x:8,y:-7}:(d.name==='Logan Gilbert')?{x:8,y:13}:{x:8,y:-7};
  const lab=el('text',{x:x(d.fipA)+off.x,y:y(d.fipH)+off.y,'text-anchor':'start',class:'plabel',
    fill:home?'var(--home-line)':'var(--away-line)'});lab.textContent=last;svg.appendChild(lab);
});
document.getElementById('wrap').appendChild(svg);
document.addEventListener('touchstart',e=>{if(e.target.tagName!=='circle')tip.style.display='none';},{passive:true});

document.getElementById('lg').innerHTML=
  '<div class="legend-item"><span class="legend-dot" style="background:var(--home);"></span>covered: better at home</div>'+
  '<div class="legend-item"><span class="legend-dot" style="background:var(--away);"></span>covered: better away</div>'+
  '<div class="legend-item"><span class="legend-dot" style="background:var(--dot);opacity:.6;"></span>other qualified starters</div>';
</script>
</body>
</html>
