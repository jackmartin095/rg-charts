<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RG Scatter Base</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  /* =========================================================================
     DESIGN TOKENS  (the shared system, edit here once, every chart inherits)
     All values are defined IN this file, so nothing depends on WordPress
     variables that do not cross the iframe boundary.
     ========================================================================= */
  :root {
    --bg:            #ffffff;
    --text-primary:  #1a1916;
    --text-secondary:#6b6860;
    --grid:          rgba(0,0,0,0.055);
    --ref-line:      rgba(0,0,0,0.16);
    --ref-label:     rgba(0,0,0,0.34);
    --tip-bg:        #ffffff;
    --tip-border:    #e0ddd4;
    --tip-shadow:    rgba(0,0,0,0.10);
    /* categorical palette, value neutral on purpose, see note in CONFIG */
    --c-a-fill:   rgba(47,127,193,0.80);   --c-a-line: #1f5a8c;
    --c-b-fill:   rgba(232,148,31,0.85);   --c-b-line: #b46e0f;
    --c-mid-fill: rgba(178,174,166,0.42);  --c-mid-line: rgba(130,126,118,0.5);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:            #15140f;
      --text-primary:  #e8e6df;
      --text-secondary:#a39a8c;
      --grid:          rgba(255,255,255,0.07);
      --ref-line:      rgba(255,255,255,0.24);
      --ref-label:     rgba(255,255,255,0.36);
      --tip-bg:        #1f1e18;
      --tip-border:    rgba(255,255,255,0.14);
      --tip-shadow:    rgba(0,0,0,0.5);
      --c-a-fill:   rgba(82,156,220,0.82);   --c-a-line: #6fb0e6;
      --c-b-fill:   rgba(240,165,60,0.85);   --c-b-line: #f0bc6a;
      --c-mid-fill: rgba(150,146,138,0.40);  --c-mid-line: rgba(180,176,168,0.5);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    padding: 18px 16px 14px;
  }
  .chart-title { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
  .chart-sub   { font-size: 11.5px; color: var(--text-secondary); margin-bottom: 14px; line-height: 1.5; }

  #wrap { position: relative; width: 100%; }
  #scatter { display: block; width: 100% !important; height: 520px; }
  @media (max-width: 600px) {
    #scatter { height: 380px; }
    .chart-title { font-size: 13px; }
    .chart-sub   { font-size: 10.5px; }
  }

  #tip {
    display: none; position: fixed; z-index: 9999; pointer-events: none;
    min-width: 200px; padding: 10px 13px;
    background: var(--tip-bg); color: var(--text-primary);
    border: 1px solid var(--tip-border); border-radius: 7px;
    box-shadow: 0 4px 16px var(--tip-shadow);
    font-size: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .tip-name { font-size: 13px; font-weight: 600; margin-bottom: 5px; }
  .tip-team { font-weight: 400; color: var(--text-secondary); }
  .tip-grid { display: flex; gap: 12px; margin-bottom: 4px; flex-wrap: wrap; }
  .tip-item label { display: block; font-size: 9px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-secondary); }
  .tip-val  { font-size: 13px; font-weight: 700; }
  .tip-sub  { font-size: 10.5px; color: var(--text-secondary); margin-top: 3px; }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; font-size: 11px; color: var(--text-secondary); padding-bottom: 4px; }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot  { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
</style>
</head>
<body>
<p class="chart-title" id="chartTitle"></p>
<p class="chart-sub" id="chartSub"></p>
<div id="wrap"><canvas id="scatter"></canvas><div id="tip"></div></div>
<div class="legend" id="legend"></div>

<script>
/* ===========================================================================
   1. CONFIG  ── the per-article edit zone.
   To make a new chart: copy this file, rename it, swap DATA below, and adjust
   the fields here. You should not need to touch the ENGINE section.
   =========================================================================== */
const CONFIG = {
  title:    "Stuff+ vs Location+: where stuff and command diverge",
  subtitle: "Stuff+ on the vertical, Location+ on the horizontal · above the line, stuff leads; below it, command leads · 50+ IP · hover or tap for detail",

  // axis fields map to keys on each DATA row
  x: { key: "locationPlus", label: "Location+", min: 79, max: 127, fmt: v => v.toFixed(0) },
  y: { key: "stuffPlus",    label: "Stuff+",    min: 79, max: 127, fmt: v => v.toFixed(0) },

  // reference geometry. 'diagonal' draws y = x (the gap line).
  // switch to 'cross' for a future quadrant piece (e.g. the 100 by 100 grid).
  reference: {
    type: "diagonal",                 // 'diagonal' | 'cross' | 'none'
    label: "Stuff+ = Location+",
    // used only when type === 'cross':
    crossX: 100, crossY: 100,
    quadrants: { tr: "", tl: "", br: "", bl: "" }
  },

  // gap is defined as y minus x. classify decides each point's category.
  // threshold of 5 keeps a neutral band around the line.
  gapThreshold: 5,
  classify(d) {
    const g = d[CONFIG.y.key] - d[CONFIG.x.key];
    if (g >=  CONFIG.gapThreshold) return "a";
    if (g <= -CONFIG.gapThreshold) return "b";
    return "mid";
  },

  // categories drive both point color and the legend.
  // NOTE: blue vs amber on purpose, not green vs red. Neither side of this
  // gap is "good", a pitcher leaning on stuff is not better than one leaning
  // on command, so a value-laden palette would mislead. Swap for a future
  // chart where one side genuinely is better.
  categories: {
    a:   { label: "Stuff outpaces command", fill: "--c-a-fill",   line: "--c-a-line"   },
    b:   { label: "Command outpaces stuff", fill: "--c-b-fill",   line: "--c-b-line"   },
    mid: { label: "Balanced",               fill: "--c-mid-fill", line: "--c-mid-line" }
  },

  // bubble sizing. field:null = fixed radius. set field to a key (e.g. "ip")
  // to size by a third variable.
  bubble: { field: null, base: 5, scale: 2.0, min: 3 },

  // direct on-canvas labels for the N points with the largest absolute gap.
  labels: {
    topN: 6,
    shorten: name => name.split(" ").pop(),
    offsets: {}   // optional per-name nudge, e.g. {"Some Name": {x:8,y:-8}}
  },

  // tooltip contents. return name, team, an array of headline stats, and a sub line.
  tooltip(d) {
    const gap = d[CONFIG.y.key] - d[CONFIG.x.key];
    const gapCol = gap >= CONFIG.gapThreshold ? token("--c-a-line")
                 : gap <= -CONFIG.gapThreshold ? token("--c-b-line")
                 : token("--text-secondary");
    return {
      name: d.name, team: d.team,
      stats: [
        { label: CONFIG.y.label, val: d[CONFIG.y.key].toFixed(0) },
        { label: CONFIG.x.label, val: d[CONFIG.x.key].toFixed(0) },
        { label: "Gap", val: (gap >= 0 ? "+" : "") + gap.toFixed(0), color: gapCol }
      ],
      sub: [d.xera != null ? ("xERA " + d.xera.toFixed(2)) : null, d.ip != null ? ("IP " + d.ip) : null].filter(Boolean).join(" · ")
    };
  }
};

/* ===========================================================================
   3. ENGINE  ── shared across all charts. You should rarely edit below here.
   =========================================================================== */
const cv  = document.getElementById("scatter");
const tip = document.getElementById("tip");

// read a CSS token at the current theme (honors light/dark)
function token(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

// derive gap, category, and bubble radius once
DATA.forEach(d => {
  d._gap = d[CONFIG.y.key] - d[CONFIG.x.key];
  d._cat = CONFIG.classify(d);
  const f = CONFIG.bubble.field;
  d._r = f ? Math.max(CONFIG.bubble.min, Math.sqrt(d[f]) * CONFIG.bubble.scale) : CONFIG.bubble.base;
});

// pick the points that get direct labels: largest absolute gap
const labelSet = new Set(
  [...DATA].sort((a, b) => Math.abs(b._gap) - Math.abs(a._gap))
           .slice(0, CONFIG.labels.topN)
           .map(d => d.name)
);

const chartData = DATA.map(d => ({
  ...d,
  x: d[CONFIG.x.key],
  y: d[CONFIG.y.key],
  r: d._r,
  backgroundColor: token(CONFIG.categories[d._cat].fill),
  borderColor:     token(CONFIG.categories[d._cat].line),
  borderWidth: d._cat === "mid" ? 0.8 : 1.3
}));

// ---- reference geometry plugin (diagonal or cross) -----------------------
const refPlugin = {
  id: "ref",
  afterDatasetsDraw(chart) {
    const r = CONFIG.reference;
    if (!r || r.type === "none") return;
    const { ctx, chartArea: { left, right, top, bottom }, scales: { x, y } } = chart;
    ctx.save();
    ctx.strokeStyle = token("--ref-line");
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 4]);

    if (r.type === "diagonal") {
      const lo = Math.max(CONFIG.x.min, CONFIG.y.min);
      const hi = Math.min(CONFIG.x.max, CONFIG.y.max);
      ctx.beginPath();
      ctx.moveTo(x.getPixelForValue(lo), y.getPixelForValue(lo));
      ctx.lineTo(x.getPixelForValue(hi), y.getPixelForValue(hi));
      ctx.stroke();
      ctx.setLineDash([]);
      if (r.label) {
        ctx.font = "10px -apple-system, sans-serif";
        ctx.fillStyle = token("--ref-label");
        ctx.textAlign = "right";
        ctx.fillText(r.label, x.getPixelForValue(hi) - 4, y.getPixelForValue(hi) + 13);
      }
    } else if (r.type === "cross") {
      const mx = x.getPixelForValue(r.crossX);
      const my = y.getPixelForValue(r.crossY);
      ctx.beginPath(); ctx.moveTo(mx, top); ctx.lineTo(mx, bottom); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(left, my); ctx.lineTo(right, my); ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = "500 10.5px -apple-system, sans-serif";
      ctx.fillStyle = token("--ref-label");
      const q = r.quadrants || {};
      if (q.tr) { ctx.textAlign = "right"; ctx.fillText(q.tr, right - 6, top + 14); }
      if (q.tl) { ctx.textAlign = "left";  ctx.fillText(q.tl, left + 6,  top + 14); }
      if (q.br) { ctx.textAlign = "right"; ctx.fillText(q.br, right - 6, bottom - 8); }
      if (q.bl) { ctx.textAlign = "left";  ctx.fillText(q.bl, left + 6,  bottom - 8); }
    }
    ctx.restore();
  }
};

// ---- direct label plugin --------------------------------------------------
const labelPlugin = {
  id: "labels",
  afterDatasetsDraw(chart) {
    const { ctx, scales: { x, y } } = chart;
    ctx.save();
    ctx.font = "600 11px -apple-system, sans-serif";
    chartData.forEach(d => {
      if (!labelSet.has(d.name)) return;
      const px = x.getPixelForValue(d.x);
      const py = y.getPixelForValue(d.y);
      const off = CONFIG.labels.offsets[d.name]
        || (d._gap >= 0 ? { x: 7, y: -6 } : { x: 7, y: 14 });
      ctx.fillStyle = token(CONFIG.categories[d._cat].line);
      ctx.textAlign = off.x < 0 ? "right" : "left";
      ctx.fillText(CONFIG.labels.shorten(d.name), px + off.x, py + off.y);
    });
    ctx.restore();
  }
};

// ---- tooltip --------------------------------------------------------------
function showTip(d, cx, cy) {
  const t = CONFIG.tooltip(d);
  const stats = t.stats.map(s =>
    `<div class="tip-item"><label>${s.label}</label>` +
    `<div class="tip-val"${s.color ? ` style="color:${s.color};"` : ""}>${s.val}</div></div>`
  ).join("");
  tip.innerHTML =
    `<div class="tip-name">${t.name} <span class="tip-team">(${t.team})</span></div>` +
    `<div class="tip-grid">${stats}</div>` +
    (t.sub ? `<div class="tip-sub">${t.sub}</div>` : "");
  const tw = 220, th = 96;
  let lx = cx + 14, ty = cy - 10;
  if (lx + tw > window.innerWidth - 10) lx = cx - tw - 14;
  if (ty + th > window.innerHeight - 10) ty = cy - th;
  if (ty < 8) ty = 8;
  tip.style.left = lx + "px";
  tip.style.top = ty + "px";
  tip.style.display = "block";
}

// ---- build legend from categories ----------------------------------------
(function buildLegend() {
  const el = document.getElementById("legend");
  el.innerHTML = Object.values(CONFIG.categories).map(c =>
    `<div class="legend-item"><span class="legend-dot" style="background:${token(c.fill)};"></span>${c.label}</div>`
  ).join("");
  if (CONFIG.bubble.field) {
    el.innerHTML += `<div class="legend-item"><span class="legend-dot" style="background:var(--c-mid-fill);border:1px solid var(--c-mid-line);"></span>bubble = ${CONFIG.bubble.field}</div>`;
  }
})();

document.getElementById("chartTitle").textContent = CONFIG.title;
document.getElementById("chartSub").textContent   = CONFIG.subtitle;

// ---- chart ----------------------------------------------------------------
const chart = new Chart(cv, {
  type: "bubble",
  data: { datasets: [{
    data: chartData,
    backgroundColor: chartData.map(d => d.backgroundColor),
    borderColor:     chartData.map(d => d.borderColor),
    borderWidth:     chartData.map(d => d.borderWidth)
  }]},
  options: {
    responsive: true, maintainAspectRatio: false, animation: false,
    layout: { padding: { top: 20, right: 70, bottom: 10, left: 10 } },
    plugins: {
      legend: { display: false },
      tooltip: {
        enabled: false,
        external({ chart, tooltip }) {
          if (!tooltip.dataPoints?.length) { tip.style.display = "none"; return; }
          const d = tooltip.dataPoints[0].raw;
          const rect = chart.canvas.getBoundingClientRect();
          showTip(d, rect.left + tooltip.caretX, rect.top + tooltip.caretY);
        }
      }
    },
    scales: {
      x: { min: CONFIG.x.min, max: CONFIG.x.max,
           title: { display: true, text: CONFIG.x.label },
           ticks: { callback: v => CONFIG.x.fmt(v) } },
      y: { min: CONFIG.y.min, max: CONFIG.y.max,
           title: { display: true, text: CONFIG.y.label },
           ticks: { callback: v => CONFIG.y.fmt(v) } }
    }
  },
  plugins: [refPlugin, labelPlugin]
});

// ---- theming for the canvas chrome (grid, ticks, titles) ------------------
// reads the same tokens the CSS uses, so light and dark stay in sync.
function applyTheme() {
  const grid = token("--grid"), txt = token("--text-secondary");
  ["x", "y"].forEach(ax => {
    chart.options.scales[ax].grid.color  = grid;
    chart.options.scales[ax].ticks.color = txt;
    chart.options.scales[ax].title.color = txt;
    chart.options.scales[ax].ticks.font  = { size: 11 };
    chart.options.scales[ax].title.font  = { size: 11 };
  });
  // refresh point colors too, in case the theme swapped category hues
  chart.data.datasets[0].backgroundColor = chartData.map(d => token(CONFIG.categories[d._cat].fill));
  chart.data.datasets[0].borderColor     = chartData.map(d => token(CONFIG.categories[d._cat].line));
  chart.update("none");
}
applyTheme();

// live update if the OS theme flips while the chart is open
const mq = matchMedia("(prefers-color-scheme: dark)");
mq.addEventListener?.("change", () => {
  chartData.forEach(d => {
    d.backgroundColor = token(CONFIG.categories[d._cat].fill);
    d.borderColor     = token(CONFIG.categories[d._cat].line);
  });
  document.getElementById("legend").querySelectorAll(".legend-dot").forEach((dot, i) => {
    const cats = Object.values(CONFIG.categories);
    if (cats[i]) dot.style.background = token(cats[i].fill);
  });
  applyTheme();
});

// ---- interaction: mouse leave + touch ------------------------------------
cv.addEventListener("mouseleave", () => { tip.style.display = "none"; });
cv.addEventListener("touchstart", e => {
  const pts = chart.getElementsAtEventForMode(e, "nearest", { radius: 20 }, true);
  if (pts.length) {
    e.preventDefault();
    const t = e.touches[0];
    showTip(chartData[pts[0].index], t.clientX, t.clientY);
  } else {
    tip.style.display = "none";
  }
}, { passive: false });
</script>
