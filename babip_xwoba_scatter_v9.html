const COLORS = {
  buy:  { fill:'rgba(30,158,117,0.88)', stroke:'#0a7050', label:'#0a7050' },
  grey: { fill:'rgba(178,174,166,0.32)', stroke:'rgba(130,126,118,0.45)' },
};

const labelOffsets = {
  "Juan Soto": {x:8,y:4},
  "Aaron Judge": {x:8,y:-8},
  "Junior Caminero": {x:8,y:4},
  "Matt Olson": {x:8,y:4},
  "Mike Trout": {x:-50,y:4},
  "Munetaka Murakami": {x:8,y:4},
  "Ketel Marte": {x:8,y:4},
};

const chartData = players.map(p => ({
  ...p, x: p.xwoba, y: p.babip,
  r: p.tag === 'grey' ? 3 : 4.5,
  backgroundColor: COLORS[p.tag].fill,
  borderColor: COLORS[p.tag].stroke,
  borderWidth: p.tag === 'grey' ? 0.8 : 1.5,
  labelOffset: labelOffsets[p.name] || {x:8, y:4}
}));

const diagPlugin = {
  id: 'diag',
  afterDatasetsDraw(chart) {
    const {ctx, scales:{x,y}} = chart;
    ctx.save();
    ctx.strokeStyle = 'rgba(0,0,0,0.14)'; ctx.lineWidth = 1; ctx.setLineDash([5,4]);
    ctx.beginPath();
    ctx.moveTo(x.getPixelForValue(.160), y.getPixelForValue(.160));
    ctx.lineTo(x.getPixelForValue(.500), y.getPixelForValue(.500));
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = '10px -apple-system,sans-serif';
    ctx.fillStyle = 'rgba(0,0,0,0.20)';
    ctx.textAlign = 'right';
    ctx.fillText('BABIP = xwOBA', x.getPixelForValue(.480) - 4, y.getPixelForValue(.480) - 5);
    ctx.restore();
  }
};

const labelPlugin = {
  id: 'labels',
  afterDatasetsDraw(chart) {
    const {ctx, scales:{x,y}} = chart;
    ctx.save();
    ctx.font = '600 10.5px -apple-system,sans-serif';
    chartData.filter(d => d.tag !== 'grey').forEach(d => {
      const px = x.getPixelForValue(d.x);
      const py = y.getPixelForValue(d.y);
      const short = d.name.split(' ').pop();
      const offset = d.labelOffset;
      ctx.fillStyle = COLORS[d.tag].label;
      ctx.textAlign = offset.x < 0 ? 'right' : 'left';
      ctx.fillText(short, px + offset.x, py + offset.y);
    });
    ctx.restore();
  }
};

const tip = document.getElementById('tip');

function showTip(d, cx, cy) {
  const gapCol = d.gap >= 0.025 ? '#b03d18' : d.gap <= -0.025 ? '#0a7050' : '#6b6860';
  tip.innerHTML = `
    <div class="tip-name">${d.name} <span class="tip-team">(${d.team})</span></div>
    <div class="tip-grid">
      <div class="tip-item"><label>BABIP</label><div class="tip-val">${d.babip.toFixed(3)}</div></div>
      <div class="tip-item"><label>xwOBA</label><div class="tip-val">${d.xwoba.toFixed(3)}</div></div>
      <div class="tip-item"><label>Gap</label><div class="tip-val" style="color:${gapCol};">${d.gap>=0?'+':''}${d.gap.toFixed(3)}</div></div>
      <div class="tip-item"><label>Rost%</label><div class="tip-val">${d.rost}%</div></div>
    </div>
    <div class="tip-sub">wRC+ ${d.wrc} · Spd ${d.spd}</div>`;
  const tw = 215, th = 100;
  let lx = cx + 14, ty = cy - 10;
  if (lx + tw > window.innerWidth - 10) lx = cx - tw - 14;
  if (ty + th > window.innerHeight - 10) ty = cy - th;
  if (ty < 8) ty = 8;
  tip.style.left = lx + 'px'; tip.style.top = ty + 'px'; tip.style.display = 'block';
}

const chart = new Chart(document.getElementById('scatter'), {
  type: 'bubble',
  data: { datasets: [{ data: chartData, backgroundColor: chartData.map(d=>d.backgroundColor), borderColor: chartData.map(d=>d.borderColor), borderWidth: chartData.map(d=>d.borderWidth) }]},
  options: {
    responsive: true, maintainAspectRatio: false, animation: false,
    layout: { padding: {top:20, right:80, bottom:10, left:10} },
    plugins: {
      legend: { display: false },
      tooltip: {
        enabled: false,
        external({chart, tooltip}) {
          if (!tooltip.dataPoints?.length) { tip.style.display='none'; return; }
          const d = tooltip.dataPoints[0].raw;
          const rect = chart.canvas.getBoundingClientRect();
          showTip(d, rect.left + tooltip.caretX, rect.top + tooltip.caretY);
        }
      }
    },
    scales: {
      x: { grid:{color:'rgba(0,0,0,0.055)'}, min:.220, max:.510, title:{display:true, text:'xwOBA', color:'#6b6860', font:{size:11}}, ticks:{color:'#6b6860', font:{size:11}, callback:v=>v.toFixed(3)} },
      y: { grid:{color:'rgba(0,0,0,0.055)'}, min:.160, max:.420, title:{display:true, text:'BABIP', color:'#6b6860', font:{size:11}}, ticks:{color:'#6b6860', font:{size:11}, callback:v=>v.toFixed(3)} }
    }
  },
  plugins: [diagPlugin, labelPlugin]
});

document.getElementById('scatter').addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  const pts = chart.getElementsAtEventForMode(e, 'nearest', {radius:20}, true);
  if (pts.length) showTip(chartData[pts[0].index], t.clientX, t.clientY);
  else tip.style.display = 'none';
}, {passive:false});

document.getElementById('scatter').addEventListener('mouseleave', () => { tip.style.display = 'none'; });
</script>
